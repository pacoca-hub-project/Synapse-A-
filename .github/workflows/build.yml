name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Achar e descompactar o projeto
        run: |
          ZIP=$(find . -name synapse_a.zip -not -path "./fonte/*" | head -1)
          if [ -z "$ZIP" ]; then echo "synapse_a.zip nao encontrado"; ls -R; exit 1; fi
          echo "Zip: $ZIP"
          unzip -q -o "$ZIP" -d fonte
      - name: Compilar APK (debug)
        run: |
          DIR=$(dirname "$(find fonte -name settings.gradle.kts | head -1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
          echo "APK_DIR=$PWD/app/build/outputs/apk/debug" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-A-debug
          path: ${{ env.APK_DIR }}/*.apk
